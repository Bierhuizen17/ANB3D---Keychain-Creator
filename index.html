<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANB3D Keychain Creator</title>
<meta name="description" content="Maak 3D-sleutelhangers en naamplaatjes uit tekst en download ze als STL. Door ANB3D, 3D Print Service.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%A7%8A%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Montserrat:wght@500;600;700;800&family=Orbitron:wght@700&family=Bangers&family=Pacifico&family=Lobster&family=Permanent+Marker&family=Black+Ops+One&family=Rubik+Mono+One&family=Press+Start+2P&family=Fredoka:wght@600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0d0d0d;--panel:#0d0d0d;--field:#17181a;--ink:#d4d6da;--mute:#8b8f96;--line:#2a2d32;--acc:#2255d6;--acc2:#3b6ff0;--stage:#050505;
--silver:linear-gradient(180deg,#e4e6e9,#8e9298)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 Montserrat,system-ui,sans-serif}
main{display:grid;grid-template-columns:1fr 340px;height:100%}
#stage{position:relative;background:radial-gradient(ellipse at 50% 40%,#16181c,#050505 70%);min-height:0}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#info{position:absolute;left:14px;bottom:12px;color:var(--mute);font-size:13px}
aside{background:var(--panel);border-left:1px solid var(--line);padding:16px 18px 22px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.logo{display:block;width:100%;max-height:150px;object-fit:contain}
h1{font:400 17px/1.25 Michroma,Montserrat,sans-serif;margin:0;text-align:center;color:transparent;background:var(--silver);-webkit-background-clip:text;background-clip:text}
h1 b{font-weight:400;color:transparent;background:linear-gradient(180deg,#4b7bff,#1d4ac4);-webkit-background-clip:text;background-clip:text}
.rule{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px;letter-spacing:.18em;justify-content:center}
.rule::before,.rule::after{content:"";height:2px;flex:1;background:var(--acc)}
label{display:flex;flex-direction:column;gap:5px;font-weight:600;color:#c3c6cb}
label.row{flex-direction:row;align-items:center;gap:8px;font-weight:500}
label span{display:flex;justify-content:space-between;color:var(--mute);font-weight:500}
label span b{color:var(--acc2)}
textarea,select,input[type=number]{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:3px;padding:8px}
textarea{resize:vertical;font-size:18px;font-weight:700}
input[type=range]{width:100%;accent-color:var(--acc2)}
input[type=checkbox]{accent-color:var(--acc2)}
input[type=color]{width:100%;height:34px;border:1px solid var(--line);border-radius:3px;background:var(--field);padding:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{font:inherit;font-weight:600;background:var(--field);color:var(--ink);border:0;padding:9px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.go{font:inherit;font-weight:700;letter-spacing:.04em;background:linear-gradient(180deg,#3b6ff0,#1d4ac4);color:#fff;border:0;border-radius:3px;padding:12px;cursor:pointer;box-shadow:0 2px 0 #0e2a7a}
.go:hover{background:linear-gradient(180deg,#4a7bff,#2255d6)}
.foot{color:var(--mute);font-size:12px;text-align:center;letter-spacing:.12em}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:46% 54%}aside{border-left:0;border-top:2px solid var(--acc)}.logo{max-height:110px}}
</style>
</head>

<h1><b>ANB3D</b> Keychain Creator</h1>
<div class="rule">3D PRINT SERVICE</div>
<label>Tekst (meerdere regels kan)<textarea id="txt" rows="2">Hallo</textarea></label>

<script>
const $=id=>document.getElementById(id);
const cv=$('v'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,200);
scene.add(new THREE.HemisphereLight(0xffffff,0x887766,.75));
const sun=new THREE.DirectionalLight(0xffffff,.9);sun.position.set(-6,10,12);scene.add(sun);
const pivot=new THREE.Group();scene.add(pivot);let grp=new THREE.Group();pivot.add(grp);
let rx=-.35,ry=.35,dist=22,mode=1;
const U=10; // scène-eenheden voor de tekstbreedte

const FS=f=>($('bold').checked?'bold ':'')+'100px '+f;
const dens=p=>{const o=[];p.forEach((q,i)=>{const n=p[(i+1)%p.length];for(let k=0;k<8;k++)o.push(new THREE.Vector2(q.x+(n.x-q.x)*k/8,q.y+(n.y-q.y)*k/8))});return o};
function inset(p,d){const A=p.reduce((s,q,i)=>{const n=p[(i+1)%p.length];return s+q.x*n.y-n.x*q.y},0)>0?1:-1;
  return p.map((q,i)=>{const a=p[(i+p.length-1)%p.length],n=p[(i+1)%p.length];let tx=n.x-a.x,ty=n.y-a.y;const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
    return new THREE.Vector2(q.x-ty*A*d,q.y+tx*A*d)})}
function ring(outer,d1,d2,hh,z,mat){const s=new THREE.Shape(d1?inset(outer,d1):outer);s.holes.push(new THREE.Path(inset(outer,d2)));
  const m=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:hh,bevelEnabled:false}),mat);m.position.z=z;return m}
function getMask(cols){
  const lines=$('txt').value.split('\n').filter(l=>l.length)||[' '];
  if(!lines.length)lines.push(' ');
  const f=$('font').value,m=document.createElement('canvas').getContext('2d');
  m.font=FS(f);
  const w=Math.max(40,...lines.map(l=>m.measureText(l).width))+40,lh=120,h=lines.length*lh+30;
  const rows=Math.max(8,Math.round(cols*h/w)),k=cols/w;
  const c=document.createElement('canvas');c.width=cols;c.height=rows;
  const x=c.getContext('2d');x.scale(k,k);x.font=FS(f);x.textAlign='center';x.textBaseline='middle';x.fillStyle='#000';
  lines.forEach((l,i)=>x.fillText(l,w/2,15+lh*(i+.5)));
  const d=x.getImageData(0,0,cols,rows).data,a=new Float32Array(cols*rows);
  for(let i=0;i<a.length;i++)a[i]=d[i*4+3]/255;
  return{a,cols,rows};
}
function blur(a,cols,rows,n){
  for(let p=0;p<n;p++){const b=new Float32Array(a.length);
    for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){let s=0,c=0;
      for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){const ii=i+di,jj=j+dj;if(ii>=0&&jj>=0&&ii<cols&&jj<rows){s+=a[jj*cols+ii];c++}}
      b[j*cols+i]=s/c}
    a=b}
  return a;
}

function outline(kind,a,b){
  const s=new THREE.Shape(),H=Math.hypot(a,b),P=2*Math.PI;
  const poly=p=>{p.forEach((q,i)=>i?s.lineTo(q[0],q[1]):s.moveTo(q[0],q[1]));s.closePath();return s};
  if(kind==='rect')return poly([[-a,-b],[a,-b],[a,b],[-a,b]]);
  if(kind==='round'){const w=2*a,h=2*b,r=Math.min(w,h)*.18,x=-a,y=-b;
    s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);
    s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);
    s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s}
  if(kind==='ellipse'){s.absellipse(0,0,a*1.42,b*1.42,0,P,false,0);return s}
  if(kind==='circle'){s.absarc(0,0,H*1.05,0,P,false);return s}
  if(kind==='hex')return poly([0,1,2,3,4,5].map(k=>[Math.cos(k*P/6)*H*1.2,Math.sin(k*P/6)*H*1.2]));
  if(kind==='star')return poly([...Array(10).keys()].map(k=>{const r=k%2?H*1.25:H*2.3,t=Math.PI/2+k*Math.PI/5;return[Math.cos(t)*r,Math.sin(t)*r]}));
  if(kind==='heart'){const k=Math.max(a/8,b/5.5)*1.08;
    return poly([...Array(72).keys()].map(i=>{const t=i/72*P;return[16*Math.pow(Math.sin(t),3)*k,(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)+1)*k]}))}
  return poly([[-a-b*1.1,0],[-a,b],[a,b],[a,-b],[-a,-b]]);
}
function solid(cols,rows,s,on,ht,zb){
  const P=[],q=(A,B,C,D)=>P.push(...A,...B,...C,...A,...C,...D);
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    if(!on(i,j))continue;
    const x0=(i-cols/2)*s,x1=x0+s,y1=(rows/2-j)*s,y0=y1-s,
      TL=ht(i,j),TR=ht(i+1,j),BL=ht(i,j+1),BR=ht(i+1,j+1);
    q([x0,y0,BL],[x1,y0,BR],[x1,y1,TR],[x0,y1,TL]);
    q([x0,y0,zb],[x0,y1,zb],[x1,y1,zb],[x1,y0,zb]);
    if(i+1>=cols||!on(i+1,j))q([x1,y0,zb],[x1,y1,zb],[x1,y1,TR],[x1,y0,BR]);
    if(i<1||!on(i-1,j))q([x0,y1,zb],[x0,y0,zb],[x0,y0,BL],[x0,y1,TL]);
    if(j<1||!on(i,j-1))q([x1,y1,zb],[x0,y1,zb],[x0,y1,TL],[x1,y1,TR]);
    if(j+1>=rows||!on(i,j+1))q([x0,y0,zb],[x1,y0,zb],[x1,y0,BR],[x0,y0,BL]);
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.computeVertexNormals();return g;
}
let bb=null,fac=1;
function build(){
  pivot.remove(grp);grp.traverse(o=>{if(o.geometry)o.geometry.dispose()});grp=new THREE.Group();pivot.add(grp);
  const cols=+$('res').value,{a,rows}=getMask(cols),s=U/cols,dep=+$('dep').value*.4;
  const kind=$('shape').value,T=kind==='none'?0:+$('pt').value||.6;
  const rimK=kind==='none'?'none':$('rim').value,bo=rimK==='chamfer'?.25:rimK==='round'?.3:0,Tt=T+2*bo,kk=(+$('psz').value||100)/100,pad=rimK==='dbl'?1.9:rimK==='rim'?1.3:.8;

        mB=new THREE.MeshStandardMaterial({color:$('c2').value,roughness:.7});

    if(top||e0==='holeleft'){const hr=.5,wc=rimK==='dbl'?1.5:rimK==='rim'?.9:.6;
      for(let n=0;n<80;n++){const P0=dens(outline(kind,A,B).getPoints(32)),X0=P0.map(p=>p.x),Y0=P0.map(p=>p.y),W0=Math.max(...X0)-Math.min(...X0),H0=Math.max(...Y0)-Math.min(...Y0);

      const pts=dens(sh.getPoints(32)),xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),
        w=Math.max(...xs)-Math.min(...xs),h=Math.max(...ys)-Math.min(...ys);

      ps=ps.map(p=>new THREE.Vector2((p.x-(x0+x1)/2)*sc,(p.y-(y0+y1)/2)*sc));
      const ew=(x1-x0)*sc/2,eh=(y1-y0)*sc/2,hr=.42;
      const clear=(x,y)=>Math.min(...pts.map(p=>Math.hypot(p.x-x,p.y-y)))>hr+.4;
      let cx=0,cy=0;
      if(e==='top'){cy=Math.max(...pts.filter(p=>Math.abs(p.x)<w*.03).map(p=>p.y))+eh-.8;for(let n=0;n<40&&!clear(cx,cy);n++)cy+=.1}
      else{cx=Math.min(...pts.filter(p=>Math.abs(p.y)<h*.03).map(p=>p.x))-ew+.8;for(let n=0;n<40&&!clear(cx,cy);n++)cx-=.1}

      const t=Math.min(1,Math.max(0,(v/c-.12)/.6));Hc[j*W+i]=t*t*(3-2*t)*dep}
    const ht=(i,j)=>Hc[j*W+i];

  }

  pivot.rotation.set(0,0,0);pivot.updateMatrixWorld(true);
  bb=new THREE.Box3().setFromObject(grp);const sz=bb.getSize(new THREE.Vector3()),c=bb.getCenter(new THREE.Vector3());

  $('info').textContent='Afmeting: '+(sz.x*fac).toFixed(0)+' × '+(sz.y*fac).toFixed(0)+' × '+(sz.z*fac).toFixed(1)+' mm';

function stlBytes(){
  const V=[],c=bb.getCenter(new THREE.Vector3()),v=new THREE.Vector3();
  const walk=(o,pm)=>{o.updateMatrix();const m=pm.clone().multiply(o.matrix);
    if(o.isMesh){const g=o.geometry,p=g.attributes.position,ix=g.index,n=ix?ix.count:p.count;
      for(let t=0;t<n;t++){v.fromBufferAttribute(p,ix?ix.getX(t):t).applyMatrix4(m);
        V.push((v.x-c.x)*fac,(v.y-c.y)*fac,(v.z-bb.min.z)*fac)}}
    o.children.forEach(ch=>walk(ch,m))};
  grp.children.forEach(ch=>walk(ch,new THREE.Matrix4()));
  const N=V.length/9,buf=new ArrayBuffer(84+50*N),dv=new DataView(buf);dv.setUint32(80,N,true);
  for(let t=0;t<N;t++){const o=84+50*t,p=V.slice(t*9,t*9+9);
    const ux=p[3]-p[0],uy=p[4]-p[1],uz=p[5]-p[2],wx=p[6]-p[0],wy=p[7]-p[1],wz=p[8]-p[2];
    let nx=uy*wz-uz*wy,ny=uz*wx-ux*wz,nz=ux*wy-uy*wx;const l=Math.hypot(nx,ny,nz)||1;

}
function makeZip(name,data){
  const T=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[n]=c>>>0}

  const nm=new TextEncoder().encode(name),L=30+nm.length,C=46+nm.length,out=new Uint8Array(L+data.length+C+22),dv=new DataView(out.buffer);
  const hdr=(o,sig,cen)=>{dv.setUint32(o,sig,true);let p=o+4;if(cen){dv.setUint16(p,20,true);p+=2}
    dv.setUint16(p,20,true);dv.setUint16(p+2,0,true);dv.setUint16(p+4,0,true);dv.setUint16(p+6,0,true);dv.setUint16(p+8,33,true);
    dv.setUint32(p+10,crc,true);dv.setUint32(p+14,data.length,true);dv.setUint32(p+18,data.length,true);dv.setUint16(p+22,nm.length,true);return p+24};
  let p=hdr(0,0x04034b50,false);dv.setUint16(p,0,true);out.set(nm,L-nm.length);out.set(data,L);
  const co=L+data.length;p=hdr(co,0x02014b50,true);out.fill(0,p,p+14);dv.setUint32(p+10,0,true);out.set(nm,co+46);
  const e=co+C;dv.setUint32(e,0x06054b50,true);dv.setUint16(e+8,1,true);dv.setUint16(e+10,1,true);dv.setUint32(e+12,C,true);dv.setUint32(e+16,co,true);
  return out;
}
function size(){const r=cv.parentNode.getBoundingClientRect();R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix()}
function loop(){
  if($('rot').checked)ry+=.006;
  pivot.rotation.set(rx,ry,0);cam.position.set(0,0,dist);cam.lookAt(0,0,0);
  R.setClearColor(0x000000,0);
  R.render(scene,cam);requestAnimationFrame(loop);
}
let drag=null;
cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{if(!drag)return;ry+=(e.clientX-drag[0])*.01;rx=Math.max(-1.5,Math.min(1.5,rx+(e.clientY-drag[1])*.01));drag=[e.clientX,e.clientY]});
cv.addEventListener('pointerup',()=>{drag=null;cv.style.cursor='grab'});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(6,Math.min(80,dist*(1+e.deltaY*.001)))},{passive:false});
['txt','font','bold','dep','res','smo','c1','c2','shape','eye','pt','mm','psz','rim'].forEach(id=>$(id).addEventListener('input',async()=>{try{await document.fonts.load(FS($('font').value),'Aa')}catch(e){}$('pv').textContent=$('psz').value+'%';
  $('dv').textContent=$('dep').value;$('rv').textContent=$('res').value;$('sv').textContent=$('smo').value;build()}));
[1,2].forEach(n=>$('m'+n).addEventListener('click',()=>{mode=n;$('m1').setAttribute('aria-pressed',n===1);$('m2').setAttribute('aria-pressed',n===2);build()}));
addEventListener('resize',size);
const inClaude=typeof claude!=='undefined'&&claude.use;
if(!inClaude)$('stl').textContent='Download .stl';
$('stl').addEventListener('click',async()=>{
